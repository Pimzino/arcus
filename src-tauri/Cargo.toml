[package]
name = "arcus"
version = "0.9.1"
description = "Cross-platform desktop GUI for rclone"
authors = ["Pimzino"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name unique so it does not clash with the bin
# name on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arcus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the tray / menu bar icon that keeps Arcus reachable while it runs in the background (background.rs).
tauri = { version = "2", features = ["tray-icon"] }
# A second launch hands over to the running copy instead of starting its own rclone (background.rs).
# 2.4.5 lets the running copy bring its window to the front on Windows; 2.5 needs tauri 2.12.
tauri-plugin-single-instance = { version = "~2.4.5", default-features = false }
tauri-plugin-opener = "2"
# Updates of Arcus from its GitHub releases, checked against the minisign key in tauri.conf.json (updater.rs).
# 2.13 needs tauri 2.12 (see single-instance above). native-tls like the app's own reqwest; no `zip`, which is
# only for the updater's v1 archive format (this app publishes the installers themselves, see release.yml).
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
pgp = { version = "0.20", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Watch folders (watch/): file system events (FSEvents on macOS, ReadDirectoryChangesW on Windows,
# inotify on Linux). `macos_fsevent` is the crate's only default feature; it is named so that turning
# off defaults cannot silently drop the macOS backend. Debouncing is done in watch/, not by a debouncer crate.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Email notifications (email.rs): async SMTP on tokio with the same native-tls the app's reqwest uses.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }

# Asking the workspace whether a folder is a package (an `.app` bundle and friends), so
# that "show in Finder" never launches one. Same crates and features the opener plugin uses.
# NSFileManager moves the pre-rename "Rclone GUI.app" to the Bin (see macos::legacy_installs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSFileManager"] }

# Unix: rclone is stopped with SIGTERM (daemon::terminate); on Linux, rclone child processes also get
# PR_SET_PDEATHSIG, so they stop when the app dies (see daemon::spawn_rcd).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
