name: Build

# Pushes to main and pull requests run the Rust tests and the type check. Only a version tag, pushed by
# `npm run release` (see README "Releases"), builds the bundles, which take most of a run's minutes, and
# publishes them as a GitHub release whose notes are that version's CHANGELOG.md section: the release is
# drafted first, each bundle job attaches its files, and it is published only once every bundle is there.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests and type check
    # `npm run release` pushes main and the version tag together, and each ref starts a run of the same
    # commit. The tag's run tests, builds and publishes it, so main's run of a "Release vX.Y.Z" commit is
    # skipped: every other job needs this one, so they are skipped with it.
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Linux webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Draft the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails unless the tag matches the version in every file that records it.
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Rclone GUI $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Rclone GUI $GITHUB_REF_NAME" --notes-file notes.md
          fi

  bundle:
    name: Bundle (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, draft-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the bundles
        shell: bash
        env:
          # Optional signing and notarization; see README "Code signing".
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri imports a signing certificate whenever APPLE_CERTIFICATE is set, even to an empty
          # value, and fails; so the Apple settings are passed on only when the certificate secret exists.
          if [ -n "$SECRET_APPLE_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY" APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_PASSWORD="$SECRET_APPLE_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          npm run tauri build -- --target ${{ matrix.target }}
      - name: Attach the bundles to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          bundles=(src-tauri/target/${{ matrix.target }}/release/bundle/{dmg/*.dmg,msi/*.msi,nsis/*.exe})
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::No bundles were built for ${{ matrix.target }}."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" --clobber

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release now that every bundle is attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
