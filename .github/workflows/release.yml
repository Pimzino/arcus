name: Release

# A version tag, pushed by `pnpm release` (see README "Releases"), tests the commit, builds the bundles
# (macOS, Windows, and Linux, whose AppImage must first pass the end-to-end test) and publishes them as a GitHub release whose notes are that version's CHANGELOG.md section: the release is
# drafted first, each bundle job attaches its files, and it is published only once every bundle is there.
# Each bundle job also attaches the signed update files installed copies download (src-tauri updater.rs),
# and the publish job lists them in `latest.json`, which the updater reads from the latest release. The
# signing key is the TAURI_SIGNING_PRIVATE_KEY secret (and its password); its public half is in
# tauri.conf.json. Without the secret no bundle is built: a release installed copies cannot update to would
# strand them on the one before.
# Everyday pushes and pull requests are ci.yml's job.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  draft-release:
    name: Draft release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Draft the release with its changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails unless the tag matches the version in every file that records it.
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Arcus $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Arcus $GITHUB_REF_NAME" --notes-file notes.md
          fi

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [test, draft-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm at the version package.json pins (packageManager), with its store cached.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the bundles
        shell: bash
        env:
          # Optional signing and notarization; see README "Code signing".
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update files (bundle.createUpdaterArtifacts, switched on for release builds only).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the update files cannot be signed."
            exit 1
          fi
          # Tauri imports a signing certificate whenever APPLE_CERTIFICATE is set, even to an empty
          # value, and fails; so the Apple settings are passed on only when the certificate secret exists.
          if [ -n "$SECRET_APPLE_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$SECRET_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SECRET_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$SECRET_APPLE_SIGNING_IDENTITY" APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_PASSWORD="$SECRET_APPLE_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          pnpm tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Attach the bundles to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          dir=src-tauri/target/${{ matrix.target }}/release/bundle
          bundles=($dir/{dmg/*.dmg,msi/*.msi,nsis/*.exe})
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::No bundles were built for ${{ matrix.target }}."
            exit 1
          fi
          # The update files: the Windows installers themselves, and on macOS the app as a tar.gz, which both
          # Macs name Arcus.app.tar.gz; it gets the version and architecture so the two do not overwrite
          # each other on the release (updater-manifest.mjs reads the architecture from the name).
          updates=($dir/{msi/*.msi.sig,nsis/*.exe.sig})
          if [ -f "$dir/macos/Arcus.app.tar.gz" ]; then
            # Not `$(case …)`: macOS runners run bash 3.2, which cannot parse a case inside $( ).
            if [[ "${{ matrix.target }}" == aarch64-* ]]; then arch=aarch64; else arch=x86_64; fi
            name="Arcus_${GITHUB_REF_NAME#v}_${arch}.app.tar.gz"
            mv "$dir/macos/Arcus.app.tar.gz" "$dir/macos/$name"
            mv "$dir/macos/Arcus.app.tar.gz.sig" "$dir/macos/$name.sig"
            bundles+=("$dir/macos/$name")
            updates+=("$dir/macos/$name.sig")
          fi
          if [ ${#updates[@]} -eq 0 ]; then
            echo "::error::No signed update files were built for ${{ matrix.target }}."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" "${updates[@]}" --clobber

  bundle-linux:
    name: Bundle (Linux x64)
    needs: [test, draft-release]
    # Built on the oldest supported Ubuntu, so the AppImage runs on distributions with an older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm at the version package.json pins (packageManager), with its store cached.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Keep the build even when the test fails, so a rerun does not start from scratch.
          cache-on-failure: true
      - name: Linux build deps, WebKitWebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file libfuse2 rpm webkit2gtk-driver xvfb
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Build the bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the update files cannot be signed."
            exit 1
          fi
          pnpm tauri build --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Use the AppImage like a first-time user
        # The file people download, not just the binary inside it; a failure here keeps the Linux bundles,
        # and so the whole release, from being published.
        shell: bash
        run: |
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "${appimage[0]}"
          ARCUS_BIN="${appimage[0]}" xvfb-run -a node e2e/linux.mjs
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Keep the screenshots, emails and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore
      - name: Attach the bundles to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          bundles=(src-tauri/target/release/bundle/{appimage/*.AppImage,deb/*.deb,rpm/*.rpm})
          if [ ${#bundles[@]} -ne 3 ]; then
            echo "::error::Expected an AppImage, a .deb and an .rpm, found: ${bundles[*]}"
            exit 1
          fi
          # Their signatures, for latest.json; the AppImage's at least, since that is what the updater replaces
          # by default (a .deb or .rpm install updates through its own package when it is signed too).
          updates=(src-tauri/target/release/bundle/{appimage/*.AppImage.sig,deb/*.deb.sig,rpm/*.rpm.sig})
          if [ ! -f "${bundles[0]}.sig" ]; then
            echo "::error::The AppImage was built without its update signature."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${bundles[@]}" "${updates[@]}" --clobber

  publish-release:
    name: Publish release
    needs: [bundle, bundle-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Attach latest.json, the update information installed copies read
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sigs
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
          node scripts/updater-manifest.mjs --tag "$GITHUB_REF_NAME" --dir sigs --notes-file notes.md > latest.json
          # Every platform must be there, or its installed copies would be told there is no update.
          node -e '
            const keys = Object.keys(JSON.parse(require("fs").readFileSync("latest.json", "utf8")).platforms);
            const need = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "windows-x86_64-msi", "linux-x86_64"];
            const missing = need.filter((k) => !keys.includes(k));
            if (missing.length) { console.error(`::error::latest.json lacks ${missing.join(", ")}`); process.exit(1); }'
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
      - name: Publish the release now that every bundle is attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
